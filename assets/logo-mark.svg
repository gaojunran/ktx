<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="ktx">
  <title>ktx</title>
  <defs>
    <linearGradient id="ktxm-kotlin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7F52FF"/>
      <stop offset="55%"  stop-color="#5894FF"/>
      <stop offset="100%" stop-color="#F88909"/>
    </linearGradient>
  </defs>

  <!-- Toolbox handle -->
  <path d="M 28 22
           C 28 6, 68 6, 68 22"
        fill="none"
        stroke="url(#ktxm-kotlin)"
        stroke-width="6"
        stroke-linecap="round"/>

  <!-- Toolbox body -->
  <rect x="10" y="20" width="76" height="64" rx="14" ry="14"
        fill="url(#ktxm-kotlin)"/>

  <!-- White inner panel -->
  <rect x="18" y="34" width="60" height="42" rx="8" ry="8"
        fill="#ffffff"/>

  <!-- Lid latch -->
  <circle cx="48" cy="27" r="3" fill="#ffffff"/>

  <!-- "k" monogram -->
  <g font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="800">
    <text x="48" y="65" font-size="32" text-anchor="middle"
          fill="url(#ktxm-kotlin)">k</text>
  </g>
</svg>
