<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120" role="img" aria-label="ktx — A modern Kotlin script runner">
  <title>ktx</title>
  <defs>
    <!-- Kotlin's signature corner-to-corner gradient: violet -> blue -> orange. -->
    <linearGradient id="ktx-kotlin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#7F52FF"/>
      <stop offset="55%"  stop-color="#5894FF"/>
      <stop offset="100%" stop-color="#F88909"/>
    </linearGradient>

    <!-- Slightly lighter version for highlight strokes. -->
    <linearGradient id="ktx-kotlin-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#9c7aff"/>
      <stop offset="55%"  stop-color="#7eaeff"/>
      <stop offset="100%" stop-color="#ffb04a"/>
    </linearGradient>

    <!-- Soft drop shadow under the toolbox. -->
    <filter id="ktx-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- ============== Toolbox ============== -->
  <!-- Toolbox body (rounded square) is the main "scaffolding" metaphor. -->
  <g transform="translate(10 14)">

    <!-- Drop shadow blob -->
    <ellipse cx="50" cy="100" rx="42" ry="4" fill="#00000022" filter="url(#ktx-soft)"/>

    <!-- Handle: a cartoon arch above the box. Stroke-only for a chunky feel. -->
    <path d="M 24 24
             C 24 8, 76 8, 76 24"
          fill="none"
          stroke="url(#ktx-kotlin)"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- Toolbox body, gradient fill, fat rounded corners. -->
    <rect x="6" y="22" width="88" height="68" rx="14" ry="14"
          fill="url(#ktx-kotlin)"/>

    <!-- Inner panel: a friendly white face that holds the wordmark / monogram. -->
    <rect x="14" y="36" width="72" height="46" rx="8" ry="8"
          fill="#ffffff"/>

    <!-- Latch dot in the middle of the lid -->
    <circle cx="50" cy="29" r="3" fill="#ffffff"/>

    <!-- Tiny gear in the top-left corner of the white panel: signals "tooling". -->
    <g transform="translate(24 48)" fill="#5894FF">
      <circle r="3.5"/>
      <circle r="1.6" fill="#ffffff"/>
      <!-- 6 teeth -->
      <g>
        <rect x="-0.9" y="-6"   width="1.8" height="2.2" rx="0.4"/>
        <rect x="-0.9" y="3.8"  width="1.8" height="2.2" rx="0.4"/>
        <rect x="-6"   y="-0.9" width="2.2" height="1.8" rx="0.4"/>
        <rect x="3.8"  y="-0.9" width="2.2" height="1.8" rx="0.4"/>
        <g transform="rotate(45)">
          <rect x="-0.9" y="-6"   width="1.8" height="2.2" rx="0.4"/>
          <rect x="-0.9" y="3.8"  width="1.8" height="2.2" rx="0.4"/>
        </g>
      </g>
    </g>

    <!-- Wrench in the bottom-right of the panel: a second tool hint. -->
    <g transform="translate(72 70) rotate(35)" fill="#F88909">
      <!-- Handle -->
      <rect x="-8" y="-1.4" width="14" height="2.8" rx="1.4"/>
      <!-- Open jaw at the right end -->
      <path d="M 6 -3
               L 9 -3
               L 9 -1.4
               L 7 -1.4
               L 7 1.4
               L 9 1.4
               L 9 3
               L 6 3
               Z"/>
    </g>

    <!-- Monogram K in the panel center, hand-drawn proportions, gradient fill. -->
    <g transform="translate(50 59)" fill="url(#ktx-kotlin)" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="800">
      <text x="0" y="6" font-size="22" text-anchor="middle">k</text>
    </g>
  </g>

  <!-- ============== Wordmark ============== -->
  <g transform="translate(118 78)" font-family="'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace" font-weight="800">
    <!-- Main "ktx" -->
    <text x="0" y="0" font-size="46" fill="url(#ktx-kotlin)" letter-spacing="-1">ktx</text>
    <!-- Tagline below, soft gray, smaller. -->
    <text x="0" y="14" font-size="6.5" fill="#6B6F76" font-weight="500" letter-spacing="0.5">
      KOTLIN SCRIPT RUNNER
    </text>
  </g>

</svg>
