syntax = "proto3";

package ktx.proto.v1;

option java_package = "io.github.nebula.ktx.proto.v1";
option java_multiple_files = true;

// ktx daemon RPC，Phase 2.1 最小子集。
//
// 帧格式：4 字节 big-endian 长度前缀 + 一个 RequestEnvelope / ResponseEnvelope
// 序列化字节。每个客户端连接对应一次请求 + 流式响应，处理完 daemon 关连接。
//
// 后续版本扩展（Lock / Compile / Status）继续往 RequestEnvelope.oneof 里加。

message RequestEnvelope {
  // 协议版本：客户端发起时填，daemon 检查不匹配直接返回失败。
  uint32 protocol_version = 1;

  oneof body {
    RunRequest run = 10;
    ShutdownRequest shutdown = 11;
    StatusRequest status = 12;
    StdinChunk stdin_chunk = 13;
  }
}

// 流式 stdin：Run 请求后，client 可以发若干 StdinChunk 帧，每帧是一段
// stdin 字节。eof=true 标志流结束（client 读到 EOF 或 stdin 已读完）。
// daemon 把 data 一段段写入脚本的 System.in 包装的 PipedOutputStream。
//
// Phase 2.3 简化：data 单帧上限走 Frames 的 32MB 默认；脚本读 stdin 时
// 阻塞等下一帧。client 发完 eof=true 后才轮到 daemon 真正开始处理（脚本
// 的 readLine() 可能在 client 发出 eof 之前就读到数据）。
message StdinChunk {
  bytes data = 1;
  bool eof = 2;
}

message ResponseEnvelope {
  oneof body {
    RunEvent run_event = 10;
    ShutdownResponse shutdown = 11;
    StatusResponse status = 12;
    ErrorEvent error = 99;
  }
}

// ---- Run --------------------------------------------------------------

// 跑一个脚本。
//   - 文件模式：填 script_path（绝对路径），daemon 直接读文件。
//   - inline 模式：填 inline_source（脚本源码），daemon 把它当 inline 跑。
// args 透传到脚本的构造器形参。
message RunRequest {
  string script_path = 1;     // 与 inline_source 二选一
  string inline_source = 2;
  repeated string args = 3;
  string virtual_name = 4;    // inline 模式的诊断文件名
  string cwd = 5;             // 客户端的工作目录，daemon 内 chdir 用

  // 依赖解析模式，Phase 2.2 起：
  //   NORMAL（默认）：用 main-kts 默认 resolver，联网走 Aether
  //   FROZEN：仅按 lockfile_path 指向的 lockfile 解析，不联网
  //   LOCK（Phase 2.3）：在线解析 + 完成后写 lockfile 到 lockfile_path。
  //                     daemon 端禁用编译产物缓存，确保 RecordingResolver
  //                     拿得到完整解析记录。
  ResolverMode resolver_mode = 6;
  string lockfile_path = 7;   // FROZEN 必填读取路径，LOCK 必填写入路径
  // stdin 字节字段已废弃 —— Phase 2.3 起改用流式 StdinChunk 帧。
  // 字段保留为 reserved，老 client 发的 bytes 也接受但不再优先消费。
  bytes stdin = 8;
}

enum ResolverMode {
  NORMAL = 0;
  FROZEN = 1;
  LOCK = 2;
}

// daemon 流式回传：脚本运行期间的 stdout/stderr 字节，最后一个 Exit。
message RunEvent {
  oneof kind {
    bytes stdout = 1;
    bytes stderr = 2;
    ExitEvent exit = 3;
  }
}

message ExitEvent {
  int32 exit_code = 1;
}

// ---- Shutdown / Status -------------------------------------------------

message ShutdownRequest {}
message ShutdownResponse {}

message StatusRequest {}
message StatusResponse {
  uint64 uptime_ms = 1;
  uint64 scripts_served = 2;
  uint64 heap_used_bytes = 3;
  uint64 heap_max_bytes = 4;
  string ktx_version = 5;
}

// ---- Error -------------------------------------------------------------

message ErrorEvent {
  string message = 1;
}
