syntax = "proto3";

package ktx.proto.v1;

option java_package = "io.github.nebula.ktx.proto.v1";
option java_multiple_files = true;

// ktx daemon RPC, the minimal subset for Phase 2.1.
//
// Frame format: 4-byte big-endian length prefix followed by a serialized
// RequestEnvelope / ResponseEnvelope. Each client connection is one request
// plus a streaming response; the daemon closes the connection when it's done.
//
// Later versions (Lock / Compile / Status) extend RequestEnvelope.oneof.

message RequestEnvelope {
  // Protocol version: the client fills it in; the daemon refuses on mismatch.
  uint32 protocol_version = 1;

  oneof body {
    RunRequest run = 10;
    ShutdownRequest shutdown = 11;
    StatusRequest status = 12;
    StdinChunk stdin_chunk = 13;
  }
}

// Streaming stdin: after a Run request, the client may send zero or more
// StdinChunk frames, each carrying a chunk of stdin bytes. eof=true marks
// the end of the stream (the client hit EOF or finished reading stdin).
// The daemon writes data into the script's System.in via a PipedOutputStream.
//
// Phase 2.3 simplification: per-frame data is capped by Frames' default
// 32 MB; while reading stdin the script blocks waiting for the next frame.
// Only after the client sends eof=true does the daemon truly start
// processing (although the script's readLine() may have already received
// data before the eof arrives).
message StdinChunk {
  bytes data = 1;
  bool eof = 2;
}

message ResponseEnvelope {
  oneof body {
    RunEvent run_event = 10;
    ShutdownResponse shutdown = 11;
    StatusResponse status = 12;
    ErrorEvent error = 99;
  }
}

// ---- Run --------------------------------------------------------------

// Runs a script.
//   - file mode: set script_path (absolute path); the daemon reads the file directly.
//   - inline mode: set inline_source (script source); the daemon runs it inline.
// args is forwarded to the script's constructor parameter.
message RunRequest {
  string script_path = 1;     // mutually exclusive with inline_source
  string inline_source = 2;
  repeated string args = 3;
  string virtual_name = 4;    // diagnostic file name for inline mode
  string cwd = 5;             // client cwd; the daemon chdirs into it

  // Dependency resolution mode, since Phase 2.2:
  //   NORMAL (default): main-kts's default resolver via Aether (online)
  //   FROZEN: resolve only via the lockfile at lockfile_path, no network
  //   LOCK (Phase 2.3): resolve online and write the lockfile to
  //                     lockfile_path on completion. The daemon disables
  //                     the compiled-script cache so RecordingResolver
  //                     observes the full resolution.
  ResolverMode resolver_mode = 6;
  string lockfile_path = 7;   // required as the source path for FROZEN, the destination for LOCK
  // The stdin bytes field is deprecated — since Phase 2.3, streaming
  // StdinChunk frames are used instead. The field is kept reserved; bytes
  // from older clients are still accepted but are no longer the primary path.
  bytes stdin = 8;
}

enum ResolverMode {
  NORMAL = 0;
  FROZEN = 1;
  LOCK = 2;
}

// Streaming response from the daemon: stdout/stderr bytes during script
// execution, terminated by a single Exit event.
message RunEvent {
  oneof kind {
    bytes stdout = 1;
    bytes stderr = 2;
    ExitEvent exit = 3;
  }
}

message ExitEvent {
  int32 exit_code = 1;
}

// ---- Shutdown / Status -------------------------------------------------

message ShutdownRequest {}
message ShutdownResponse {}

message StatusRequest {}
message StatusResponse {
  uint64 uptime_ms = 1;
  uint64 scripts_served = 2;
  uint64 heap_used_bytes = 3;
  uint64 heap_max_bytes = 4;
  string ktx_version = 5;
}

// ---- Error -------------------------------------------------------------

message ErrorEvent {
  string message = 1;
}
