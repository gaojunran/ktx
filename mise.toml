[tools]
java = "temurin-21"
gradle = "8.14"
node = "20"
pnpm = "10"
# Kotlin distribution used by the benchmark suite (we drive its `kotlin`
# launcher to time main-kts head-to-head with ktx). Pinning here means
# `mise-action` in CI installs it for free; locally `mise install` brings
# it down to ~/.local/share/mise/installs/kotlin/.
kotlin = "2.3.21"
# hyperfine drives the benchmarks. Available via mise's aqua backend so
# CI does not have to apt-install or curl release debs.
"aqua:sharkdp/hyperfine" = "1.18.0"
# usage CLI consumes the KDL spec produced by `ktx usage` and renders it
# to markdown / shell completions / man-pages. Used by `mise run render`.
usage = "latest"
graalvm = "latest"

[env]
# Resolve relative paths from repo root by default; tasks that need otherwise
# override `dir = "..."`.
KTX_PROJECT_ROOT = "{{config_root}}"
# Put the freshly built ktx binary on PATH so render and other tasks can
# invoke `ktx` directly without the long install path. Requires that
# `mise run build` has been run at least once.
_.path = ["./modules/cli/build/install/ktx/bin"]

[tasks.build]
description = "Build the ktx CLI distribution into modules/cli/build/install/ktx/"
run = "./gradlew :modules:cli:installDist"

[tasks.test]
description = "Run all unit tests"
run = "./gradlew test"

[tasks."test:watch"]
description = "Run unit tests continuously on file changes"
run = "./gradlew test --continuous"

[tasks.run]
description = "Run a sample script through the freshly built ktx CLI"
depends = ["build"]
run = "./modules/cli/build/install/ktx/bin/ktx samples/hello.main.kts foo bar"

[tasks."daemon:stop"]
description = "Stop every running ktx daemon (no-op if none)"
run = "./modules/cli/build/install/ktx/bin/ktx daemon stop --all || true"

[tasks."daemon:status"]
description = "Show status of all ktx daemons"
run = "./modules/cli/build/install/ktx/bin/ktx daemon status --all"

[tasks."native:hello"]
description = "Compile samples/hello.main.kts into a single native binary (samples/hello). Requires GraalVM via mise (e.g. `mise install java@oracle-graalvm-21.0.7`); the task locates native-image via $GRAALVM_HOME / $JAVA_HOME / $PATH."
depends = ["build"]
run = """
rm -f samples/hello samples/hello.exe
./modules/cli/build/install/ktx/bin/ktx compile --native --collect-metadata samples/hello.main.kts
./samples/hello arg1 arg2
"""

[tasks."native:jackson"]
description = "Compile samples/jackson.main.kts into a single native binary (samples/jackson). Same GraalVM prerequisites as native:hello; demonstrates GRMR-bundled jackson metadata picking up automatically."
depends = ["build"]
run = """
rm -f samples/jackson samples/jackson.exe
./modules/cli/build/install/ktx/bin/ktx compile --native --collect-metadata samples/jackson.main.kts
./samples/jackson
"""

[tasks.clean]
description = "Clean Gradle build outputs and ktx runtime caches"
run = """
./gradlew clean
rm -rf ~/.cache/ktx
"""

[tasks."docs:install"]
description = "Install the VitePress site dependencies"
dir = "{{config_root}}/docs"
run = "pnpm install --frozen-lockfile"

[tasks."docs:dev"]
description = "Start the VitePress site in dev mode at http://localhost:5173"
dir = "{{config_root}}/docs"
depends = ["docs:install"]
run = "pnpm dev"

[tasks."docs:build"]
description = "Build the VitePress site (output under docs/.vitepress/dist/)"
dir = "{{config_root}}/docs"
depends = ["docs:install"]
run = "pnpm build"

[tasks.dist]
description = "Produce release archives (zip + tar.gz) under modules/cli/build/distributions/"
run = "./gradlew :modules:cli:distZip :modules:cli:distTar"

[tasks.bench]
description = "Run hyperfine benchmarks of ktx vs main-kts; refresh benchmarks/results.json"
depends = ["build"]
run = "./benchmarks/bench.sh"

[tasks.render]
description = "Regenerate CLI docs from the clikt tree via the usage tool."
depends = ["build"]
run = [
    "ktx usage > ktx.usage.kdl",
    "find docs/cli -type f -name '*.md' -not -name 'index.md' -delete 2>/dev/null || true",
    "mkdir -p docs/cli",
    # --html-encode escapes raw <angle> brackets in help text so VitePress's
    # vue-flavored markdown parser does not mistake them for HTML tags.
    "usage g markdown -m --html-encode -f ktx.usage.kdl --out-dir docs/cli --url-prefix /cli",
    "usage g json -f ktx.usage.kdl > docs/cli/commands.json",
]

[tasks.ci]
description = "Run everything CI runs: tests, CLI build, docs build"
depends = ["test", "build", "docs:build"]
