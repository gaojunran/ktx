name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# Newer pushes cancel older runs on the same ref. release.yml has its own
# concurrency group with cancel-in-progress: false to avoid half-deployed
# state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to no permissions; each job opts in to what it needs.
permissions: {}

env:
  MISE_EXPERIMENTAL: "true"
  # Gradle pulls dev.usage-spec:* from GitHub Packages, which requires auth
  # for any operation including read. settings.gradle.kts maps these to
  # the maven `credentials` block. Use KTX_-prefixed vars: GitHub disallows
  # GH_/GITHUB_ prefixed names in workflow env. The settings file falls back
  # to GITHUB_USERNAME / GITHUB_TOKEN (the conventional names) when those
  # are exported by other CI systems or local user shells.
  KTX_GH_USERNAME: ${{ github.actor }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # GITHUB_TOKEN is auto-injected and reserved; re-expose it under a
      # KTX_-prefixed name. settings.gradle.kts checks this then falls back
      # to GITHUB_TOKEN (which is set automatically inside `run:` blocks).
      KTX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Run tests
        run: mise run test

      - name: Build CLI distribution
        run: mise run build

      - name: Build VitePress site
        run: mise run docs:build

  # Benchmark only when the commit message contains [update benchmark].
  # This avoids noisy auto-commits on every push; opt in when changes affect
  # the benchmarked code paths. Result is committed back to main via
  # stefanzweifel/git-auto-commit-action; the perf page rebuilds on the next
  # docs deploy.
  benchmark:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[update benchmark]')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: read
    env:
      KTX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need a writable token so the auto-commit action can push back.
          # GITHUB_TOKEN with contents:write is enough for non-protected
          # branches; if main is protected, switch to a PAT in a secret.
          persist-credentials: true

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Build CLI distribution
        run: mise run build

      - name: Run benchmarks
        # Benchmark numbers from a shared GitHub runner are noisier than a
        # quiet laptop, but they are still useful as a regression signal
        # and as the canonical published numbers.
        run: mise run bench

      - name: Commit updated results.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bench: refresh results.json [skip ci]"
          file_pattern: benchmarks/results.json
          # The commit message includes [skip ci] so the auto-commit
          # itself does not retrigger this workflow.

  # Regenerate the CLI reference docs (docs/cli/) from the live clikt tree.
  # Same gating as benchmark: only on push to main; auto-commits its result
  # back with [skip ci] so the loop terminates. Needs GITHUB_USERNAME +
  # GITHUB_TOKEN exported into Gradle's repository auth so the build can
  # pull `dev.usage-spec:clikt-usage` from GitHub Packages.
  render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    env:
      KTX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Render CLI docs
        run: mise run render

      - name: Commit refreshed CLI docs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: refresh generated CLI reference [skip ci]"
          file_pattern: "docs/cli/** ktx.usage.kdl"

  # Only deploys on pushes to main. PRs build the site (above) but never
  # publish, so we can verify the build without exposing in-flight changes.
  deploy-docs:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - test
      # benchmark commits a fresh results.json before docs deploy so the
      # published perf page picks it up. If benchmark is skipped (PRs or
      # tag pushes — though tags don't reach here anyway) the dependency
      # uses `if: !cancelled()` semantics via job-level if checks.
      - benchmark
      # render does the same for the auto-generated CLI reference under
      # docs/cli/, regenerated from the live clikt tree on every push.
      - render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
      contents: read
      packages: read
    env:
      KTX_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # benchmark just pushed a new commit on main; re-checkout + rebuild
      # so the deployed site contains the freshest results.json.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          experimental: true

      - name: Build VitePress site
        run: mise run docs:build

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Single status check for branch-protection rules: required-status-checks
  # can target this name and we never have to update the rule when adding
  # more upstream jobs.
  final:
    needs:
      - test
      - benchmark
      - render
      - deploy-docs
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # `always()` would override `cancel-in-progress` and waste a runner. The
    # `!cancelled()` form preserves cancellation while still letting us see
    # which upstream job failed.
    if: ${{ !cancelled() }}
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              # `skipped` is fine for deploy-docs / benchmark on PRs, but
              # not for test.
              if result in ("success", "skipped"):
                  print(f"::notice::{name}: {result}")
              else:
                  print(f"::error::{name}: {result}")
                  failed = True

          if failed:
              print("One or more upstream jobs did not complete successfully.")
              sys.exit(1)

          print("All CI jobs completed successfully.")
          PY
